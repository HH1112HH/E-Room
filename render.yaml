services:
  - type: web
    name: e-room-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: LIVEKIT_URL
        value: wss://project-e-room-egbiumj8.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: eroom
      - key: MINIO_SECURE
        value: "false"
      - key: TURN_SERVER_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
